[package]
name = "kino-relay"
version = "0.1.1"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
axum = { version = "0.7", features = ["ws", "macros"] }
# Lets the relay terminate TLS itself (wss://) when no reverse proxy fronts it.
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
# Bearer-token auth: static-token comparison that doesn't leak timing, and
# HS256 JWT verification for tokens issued by kino-control.
subtle = "2"
jsonwebtoken = "9"
# Small blocking HTTP client, used once at startup to self-enroll with
# kino-control. rustls - no OpenSSL system dependency. `native-certs` makes it
# honour the OS trust store (like kino-agent does), so enrollment works behind
# a TLS-inspecting corporate proxy or against a control plane using a private
# CA; without it only Mozilla's bundled roots are trusted and those setups fail
# with "invalid peer certificate: UnknownIssuer".
ureq = { version = "2", default-features = false, features = ["tls", "json", "native-certs"] }
