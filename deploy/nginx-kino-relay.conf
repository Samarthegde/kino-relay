# nginx reverse proxy for kino-relay.
#
# Two things here are load-bearing and easy to get wrong:
#
#   1. The Upgrade/Connection headers. Without them nginx does not forward the
#      WebSocket handshake, and *every* kino connection fails - the client never
#      sees a 101 Switching Protocols. This is the #1 cause of "agent connects
#      but the manager times out".
#
#   2. proxy_read_timeout. The default 60s tears down any connection that goes
#      quiet for a minute. The relay pings the *control* channel every 30s, so
#      that one survives - but a data socket carrying an idle SSH terminal has
#      no such keepalive and would be killed mid-session. Hence 1h.

# ── http{} context ───────────────────────────────────────────────────────────
# This map MUST live at http{} level, not inside server{}. On Debian/Ubuntu put
# it in /etc/nginx/conf.d/websocket.conf; it is safe to define once globally.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── server{} ─────────────────────────────────────────────────────────────────
server {
    server_name relay.example.com;

    access_log /var/log/nginx/kino-relay.access.log;
    error_log  /var/log/nginx/kino-relay.error.log warn;

    location / {
        proxy_pass http://10.1.10.96:3000;

        # WebSockets require HTTP/1.1 + an explicit upgrade.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout    1h;
        proxy_read_timeout    1h;

        # Interactive byte streams - buffering them adds latency for no gain.
        proxy_buffering off;
    }

    # Cheap liveness check that doesn't involve a WebSocket upgrade:
    #   curl https://relay.example.com/healthz  ->  ok
}
